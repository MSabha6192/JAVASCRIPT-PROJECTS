<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Arow Function</title>
</head>

<body>
    <h1>Adding numbers</h1>
    <button onclick="MyFunction()">Click Here</button>
    <p id="result"></p>
    <script>
        MyFunction = () => {

            document.getElementById("result").innerHTML = "The sum of 9 and 10 is 19";
        }
    </script>

</body>

</html>
